<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WantedNFT 🌈 — Rainbow Mint Magic</title>
<link rel="icon" href="data:,">
<style>
  :root{--glass: rgba(255,255,255,0.06);--card:#0f1720}
  html,body{height:100%;margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#ff3b3b,#ff8a00,#ffd400,#4bd962,#3fb3ff,#8b5cf6,#ff66b2);background-size:400% 400%;animation:rainbowBG 15s linear infinite;color:#fff}
  @keyframes rainbowBG{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .wrap{max-width:920px;margin:24px auto;padding:20px;text-align:center}
  h1{margin:6px 0;font-weight:700}
  p.lead{opacity:.95;margin:0 0 16px}
  .controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:12px 0}
  .control{flex:1 1 260px;max-width:420px;display:flex;flex-direction:column;gap:8px}
  input[type="text"],textarea,input[type="file"]{padding:12px;border-radius:12px;border:0;font-size:15px;background:rgba(255,255,255,0.06);color:#fff;outline:none}
  button.btn{padding:12px;border-radius:12px;border:0;background:#fff;color:#000;font-weight:700;cursor:pointer;transition:transform .12s;box-shadow:0 6px 18px rgba(0,0,0,0.25)}
  button.btn:hover{transform:translateY(-3px)}
  button.secondary{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.08)}
  button[disabled]{opacity:.6;cursor:not-allowed;transform:none}
  #preview{max-width:240px;margin:0 auto;border-radius:14px;display:none;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
  .status{margin-top:10px;opacity:.95}
  .feed{margin-top:26px;display:flex;flex-direction:column;gap:12px;align-items:center}
  .card{width:100%;max-width:560px;background:rgba(255,255,255,0.05);padding:12px;border-radius:12px;text-align:left;display:flex;gap:12px;align-items:center}
  .thumb{width:72px;height:72px;border-radius:8px;object-fit:cover;background:linear-gradient(0deg,#222,#111)}
  .card .meta{flex:1}
  small.hint{opacity:.9}
  footer{margin-top:26px;opacity:.9;font-size:13px}
</style>
</head>
<body>
  <div class="wrap">
    <h1>WantedNFT 🌈</h1>
    <p class="lead">Rainbow Mint Magic — connect wallet, upload art, mint, and share ✨</p>

    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button id="connectBtn" class="btn">Connect Wallet</button>
      <button id="disconnectBtn" class="secondary" style="display:none">Disconnect</button>
    </div>

    <div class="controls" style="margin-top:18px">
      <div class="control">
        <input id="nftName" type="text" placeholder="NFT Name" autocomplete="off" />
        <textarea id="nftDesc" rows="3" placeholder="NFT Description"></textarea>
        <input id="nftImage" type="file" accept="image/*" />
        <img id="preview" alt="preview"/>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:6px">
          <button id="mint" class="btn" disabled>Mint NFT 🌈</button>
          <button id="shareFarcaster" class="secondary" disabled>Share after mint</button>
        </div>
        <p class="status" id="status">Status: Not connected</p>
        <small class="hint">Uses NFT.Storage for decentralized uploads — no backend needed.</small>
      </div>
    </div>

    <h3 style="margin-top:26px">Live NFT Feed</h3>
    <div id="feed" class="feed"></div>

    <footer>Made with ❤️ by WantedNFT — Rainbow Mint Magic 🌈</footer>
  </div>

  <!-- WalletConnect v2 + Web3Modal v3 -->
  <script type="module">
  import { ethers } from "https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.min.js";
  import { EthereumClient, w3mConnectors, w3mProvider } from "https://unpkg.com/@web3modal/ethereum@3.3.0/dist/index.js";
  import { Web3Modal } from "https://unpkg.com/@web3modal/html@3.3.0/dist/index.js";
  import { NFTStorage, File } from "https://cdn.jsdelivr.net/npm/nft.storage/dist/bundle.esm.min.js";

  const projectId = "9d430850bfe90cadc02d42b78f7dfd2d5dadaef1";
  const CONTRACT_ADDRESS = "0x071d79fb0a7b06ACA531e653f8A84121cE667e8E";
  const FARCASTER_SERVER_URL = "https://farcasterserver.onrender.com/post";

  const chains = [{
    id: 8453,
    name: "Base",
    network: "base",
    rpcUrls: { default: { http: ["https://base-mainnet.infura.io/v3/ceed5012f1e644dc9decb187d8f53d52"] } }
  }];

  const ethereumClient = new EthereumClient({ chains, projectId });
  const web3modal = new Web3Modal({ projectId, themeMode: "dark", themeVariables: { "--w3m-accent": "#ff66b2" } }, ethereumClient);

  const status = document.getElementById("status");
  const connectBtn = document.getElementById("connectBtn");
  const disconnectBtn = document.getElementById("disconnectBtn");
  const mintBtn = document.getElementById("mint");
  const shareBtn = document.getElementById("shareFarcaster");
  const preview = document.getElementById("preview");
  const nftImage = document.getElementById("nftImage");
  const nftName = document.getElementById("nftName");
  const nftDesc = document.getElementById("nftDesc");
  const feed = document.getElementById("feed");

  let provider, signer;

  const ABI = [
    "event Transfer(address indexed from,address indexed to,uint256 indexed tokenId)",
    "function mint(address to,string memory uri) public returns(uint256)",
    "function tokenURI(uint256 tokenId) public view returns(string memory)"
  ];

  function updateStatus(msg){ status.innerText = "Status: " + msg; }

  nftImage.onchange = e => {
    const file = e.target.files[0];
    if (file) { preview.src = URL.createObjectURL(file); preview.style.display = "block"; }
    else preview.style.display = "none";
  };

  connectBtn.onclick = async () => { web3modal.openModal(); };

  ethereumClient.watchAccount(async (acc) => {
    if (acc?.address) {
      provider = new ethers.BrowserProvider(ethereumClient.getWalletClient());
      signer = await provider.getSigner();
      connectBtn.innerText = `${acc.address.slice(0,6)}…${acc.address.slice(-4)}`;
      disconnectBtn.style.display = "inline-block";
      mintBtn.disabled = false;
      shareBtn.disabled = false;
      updateStatus("Connected ✅");
    } else {
      connectBtn.innerText = "Connect Wallet";
      disconnectBtn.style.display = "none";
      mintBtn.disabled = true;
      shareBtn.disabled = true;
      updateStatus("Disconnected ❌");
    }
  });

  disconnectBtn.onclick = () => { web3modal.closeModal(); updateStatus("Disconnected"); };

  mintBtn.onclick = async () => {
    if (!signer) return alert("Connect wallet first!");
    const name = nftName.value.trim(), desc = nftDesc.value.trim(), file = nftImage.files[0];
    if (!name || !desc || !file) return alert("Fill all fields!");

    try {
      mintBtn.disabled = true;
      updateStatus("Uploading to NFT.Storage...");
      const client = new NFTStorage({ token: projectId });
      const metadata = await client.store({ name, description: desc, image: new File([file], file.name, { type: file.type }) });

      updateStatus("Minting NFT on Base...");
      const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
      const tx = await contract.mint(await signer.getAddress(), metadata.url);
      await tx.wait();

      updateStatus("Minted 🎉");
      feed.innerHTML = `<div class='card'><img class='thumb' src='${URL.createObjectURL(file)}'><div class='meta'><strong>${name}</strong><br><a href='${metadata.url}' target='_blank'>View Metadata</a></div></div>` + feed.innerHTML;
    } catch (e) {
      console.error(e);
      updateStatus("Error: " + e.message);
    } finally {
      mintBtn.disabled = false;
    }
  };

  shareBtn.onclick = async () => {
    const first = feed.querySelector("a"); if (!first) return alert("No NFT to share!");
    const text = `Just minted "${nftName.value}" 🌈 ${first.href}`;
    await fetch(FARCASTER_SERVER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    updateStatus("Shared to Farcaster ✅");
  };

  updateStatus("Ready 🌈");
  </script>
</body>
</html>
