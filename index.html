<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WantedNFT🌈</title>

<style>
  body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,red,orange,yellow,green,blue,indigo,violet);
    background-size:400% 400%;
    animation:rainbowBG 15s ease infinite;
    color:#fff;
    text-align:center;
    padding:15px;
    margin:0;
  }
  @keyframes rainbowBG{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }
  input,button{
    width:90%;max-width:400px;
    padding:12px;margin:8px 0;
    border-radius:12px;border:none;
    font-size:18px;
  }
  button{
    background:#fff;color:#000;
    font-weight:bold;cursor:pointer;
    transition:transform .2s;
  }
  button:hover{transform:scale(1.05);}
  button:disabled{background:#aaa;cursor:not-allowed;}
  #nftFeed div{
    background:rgba(255,255,255,.2);
    padding:12px;margin:12px auto;
    border-radius:12px;max-width:400px;
  }
  a{color:#fff;text-decoration:underline;}
  #previewImg{
    max-width:200px;max-height:200px;
    margin:10px auto;border-radius:12px;
    display:none;
  }
  .small{font-size:0.9em;color:#ddd;}
</style>
</head>
<body>

<h1>WantedNFT🌈</h1>

<button id="connectBtn" onclick="connectWallet()">Connect Wallet</button><br/><br/>

<input type="text" id="nftName" placeholder="NFT Name" /><br/>
<input type="text" id="nftDesc" placeholder="NFT Description" /><br/>
<input type="file" id="nftImage" accept="image/*" onchange="showPreview(event)" /><br/>
<img id="previewImg" alt="Image Preview" /><br/>

<button id="mintButton" onclick="mintNFT()" disabled>Mint NFT</button>

<p id="status">Checking wallet…</p>

<h2>Live NFT Feed</h2>
<div id="nftFeed"></div>

<p class="small">
  Use <a href="https://metamask.io" target="_blank">MetaMask</a> or 
  <a href="https://base.org/wallet" target="_blank">Base Wallet</a> on <strong>Base Mainnet</strong>.
</p>

<script type="module">
import { NFTStorage, File } from 'https://cdn.jsdelivr.net/npm/nft.storage/dist/bundle.esm.min.js';
import { ethers } from "https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js";

/* ==================== CONFIG ==================== */
const NFT_STORAGE_API_KEY = 'YOUR_NFT_STORAGE_KEY_HERE'; // <-- REPLACE!
const CONTRACT_ADDRESS = '0x071d79fb0a7b06ACA531e653f8A84121cE667e8E';
const BASE_CHAIN_ID = 8453;               // Base Mainnet
const FARCASTER_SERVER_URL = 'https://farcasterserver.onrender.com/post';

/* ==================== GLOBALS ==================== */
let provider, signer, contract;

/* ==================== HELPERS ==================== */
function $(id){return document.getElementById(id);}
function setStatus(txt){ $('status').innerText = txt; }

/* ==================== WALLET CONNECT ==================== */
async function connectWallet(){
  // 1. Detect provider
  if(!window.ethereum){
    setStatus('MetaMask / Web3 wallet not found. Install one.');
    return;
  }

  provider = new ethers.providers.Web3Provider(window.ethereum, "any");

  try{
    // 2. Request accounts
    await provider.send("eth_requestAccounts", []);
    signer = provider.getSigner();
    const address = await signer.getAddress();

    // 3. Ensure correct network
    const network = await provider.getNetwork();
    if(network.chainId !== BASE_CHAIN_ID){
      try{
        await window.ethereum.request({
          method:'wallet_switchEthereumChain',
          params:[{chainId:'0x'+BASE_CHAIN_ID.toString(16)}] // 0x2105
        });
      }catch(switchErr){
        if(switchErr.code===4902){
          setStatus('Base Mainnet not added to your wallet. Add it manually.');
        }else{
          setStatus('Network switch failed: '+switchErr.message);
        }
        return;
      }
    }

    // 4. Contract instance
    contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);

    // 5. UI success
    setStatus(`Connected: ${address.slice(0,6)}…${address.slice(-4)}`);
    $('connectBtn').innerText = 'Wallet Connected';
    $('connectBtn').disabled = true;
    $('mintButton').disabled = false;

    // 6. Listen for new mints
    contract.on("Transfer", async (from, to, tokenId) => {
      if(from === ethers.constants.AddressZero){
        const uri = await contract.tokenURI(tokenId);
        addNFTToFeed(tokenId.toString(), uri);
      }
    });

  }catch(err){
    console.error(err);
    setStatus('Connect error: '+(err.message||err).substring(0,80)+'…');
  }
}

/* ==================== IMAGE PREVIEW ==================== */
function showPreview(e){
  const file = e.target.files[0];
  if(!file) return;
  const img = $('previewImg');
  img.src = URL.createObjectURL(file);
  img.style.display = 'block';
}

/* ==================== MINT NFT ==================== */
async function mintNFT(){
  const name = $('nftName').value.trim();
  const desc = $('nftDesc').value.trim();
  const file = $('nftImage').files[0];

  if(!name||!desc||!file){
    alert('Please fill Name, Description and upload an Image.');
    return;
  }

  setStatus('Uploading to NFT.Storage…');
  try{
    const client = new NFTStorage({ token: NFT_STORAGE_API_KEY });
    const metadata = await client.store({
      name, description: desc,
      image: new File([file], file.name, {type:file.type})
    });

    setStatus('Minting on Base…');
    const tx = await contract.mint(await signer.getAddress(), metadata.url);
    const receipt = await tx.wait();

    setStatus('Minted! Token ID: '+receipt.events[0].args.tokenId.toString());

    // Optional Farcaster share
    try{
      await fetch(FARCASTER_SERVER_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text:`Just minted "${name}" on Base! ${metadata.url}`})
      });
      setStatus(prev=>prev+' | Shared on Farcaster');
    }catch(e){/* ignore */ }

  }catch(err){
    console.error(err);
    setStatus('Mint error: '+(err.message||err).substring(0,100)+'…');
  }
}

/* ==================== FEED ==================== */
function addNFTToFeed(tokenId, tokenURI){
  const feed = $('nftFeed');
  const div = document.createElement('div');
  div.innerHTML = `
    <strong>Token #${tokenId}</strong><br/>
    <a href="${tokenURI}" target="_blank">View Metadata</a><br/><hr/>
  `;
  feed.prepend(div);
}

/* ==================== ABI ==================== */
const ABI = [
  "event Transfer(address indexed from, address indexed to, uint256 indexed tokenId)",
  "function mint(address to, string memory uri) public returns (uint256)",
  "function tokenURI(uint256 tokenId) public view returns (string memory)",
  "function owner() public view returns (address)" // optional – helps debugging
];

/* ==================== INIT ==================== */
window.addEventListener('load',()=>{
  // Simple HTTPS check (except localhost)
  if(location.protocol!=='https:' && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'){
    setStatus('This site must be served over HTTPS.');
  }else{
    setStatus('Click “Connect Wallet” to start');
  }
});

/* Export for onclick */
window.connectWallet = connectWallet;
window.mintNFT = mintNFT;
window.showPreview = showPreview;
</script>
</body>
</html>
