<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WantedNFT 🌈</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, red, orange, yellow, green, blue, indigo, violet);
    background-size: 400% 400%;
    animation: rainbowBG 15s ease infinite;
    color: #fff;
    text-align: center;
    padding: 15px;
  }
  @keyframes rainbowBG {
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }
  input, button {
    width: 90%;
    max-width: 400px;
    padding: 12px;
    margin: 8px 0;
    border-radius: 12px;
    border: none;
    font-size: 18px;
  }
  button {
    background: white;
    color: black;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
  }
  button:hover { transform: scale(1.05); }
  button:disabled { background: #aaa; cursor: not-allowed; }
  #nftFeed div {
    background: rgba(255, 255, 255, 0.2);
    padding: 12px;
    margin: 12px auto;
    border-radius: 12px;
    max-width: 400px;
  }
  a { color: #fff; text-decoration: underline; }
  #previewImg {
    max-width: 200px;
    max-height: 200px;
    margin: 10px auto;
    border-radius: 12px;
    display: none;
  }
</style>

<script type="module">
import { NFTStorage, File } from 'https://cdn.jsdelivr.net/npm/nft.storage/dist/bundle.esm.min.js';
import { ethers } from "https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js";

// ===== CONFIG =====
const NFT_STORAGE_API_KEY = '9d430850.bfe90cadc02d42b78f7dfd2d5dadaef1';
const CONTRACT_ADDRESS = '0x071d79fb0a7b06ACA531e653f8A84121cE667e8E';
const BASE_CHAIN_ID = 8453;
const FARCASTER_SERVER_URL = 'https://farcasterserver.onrender.com/post';

let provider, signer, contract;

// ===== UTILITY =====
function setStatus(msg) {
  document.getElementById('status').innerText = msg;
}

// ===== CONNECT WALLET =====
async function connectWallet() {
  if (!window.ethereum) {
    alert('💡 Wallet not found! Install MetaMask or Base Wallet.');
    return;
  }

  provider = new ethers.providers.Web3Provider(window.ethereum, "any");

  try {
    await provider.send("eth_requestAccounts", []);
    signer = provider.getSigner();

    const network = await provider.getNetwork();
    if (network.chainId !== BASE_CHAIN_ID) {
      try {
        await window.ethereum.request({
          method: 'wallet_switchEthereumChain',
          params: [{ chainId: '0x' + BASE_CHAIN_ID.toString(16) }]
        });
        setStatus('✅ Switched to Base Mainnet');
      } catch (switchError) {
        if (switchError.code === 4902) {
          setStatus('⚠️ Base Mainnet not added. Add it manually.');
        } else {
          setStatus('⚠️ Network switch failed: ' + switchError.message);
        }
        return;
      }
    }

    const address = await signer.getAddress();
    setStatus(`✅ Wallet Connected: ${address.slice(0,6)}…${address.slice(-4)}`);
    document.getElementById('mintButton').disabled = false;

    contract = new ethers.Contract(CONTRACT_ADDRESS, [
      "event Transfer(address indexed from, address indexed to, uint256 indexed tokenId)",
      "function mint(address to, string memory uri) public returns (uint256)",
      "function tokenURI(uint256 tokenId) public view returns (string memory)"
    ], signer);

    // Live feed listener
    contract.on("Transfer", async (from, to, tokenId) => {
      if(from === ethers.constants.AddressZero) {
        const tokenURI = await contract.tokenURI(tokenId);
        addNFTToFeed(tokenId.toString(), tokenURI);
      }
    });

  } catch(err) {
    console.error(err);
    setStatus('❌ Connect failed: ' + (err.message || err));
  }
}

// ===== SHOW IMAGE PREVIEW =====
function showPreview(event) {
  const preview = document.getElementById('previewImg');
  preview.src = URL.createObjectURL(event.target.files[0]);
  preview.style.display = 'block';
}

// ===== MINT NFT =====
async function mintNFT() {
  const name = document.getElementById('nftName').value.trim();
  const description = document.getElementById('nftDesc').value.trim();
  const file = document.getElementById('nftImage').files[0];

  if(!name || !description || !file) return alert('⚠️ Fill all fields');

  setStatus('⏳ Uploading to NFT.Storage…');
  try {
    const client = new NFTStorage({ token: NFT_STORAGE_API_KEY });
    const metadata = await client.store({
      name,
      description,
      image: new File([file], file.name, { type: file.type })
    });

    setStatus('⏳ Minting NFT on Base…');
    const tx = await contract.mint(await signer.getAddress(), metadata.url);
    await tx.wait();
    setStatus(`✅ NFT Minted! TokenID: ${tx.hash.slice(0,10)}…`);

    // Optional Farcaster share
    try {
      await fetch(FARCASTER_SERVER_URL, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ text: `Just minted "${name}" 🌈 ${metadata.url}` })
      });
      setStatus(prev => prev + ' | Shared on Farcaster!');
    } catch(e){ /* ignore Farcaster errors */ }

  } catch(err) {
    console.error(err);
    setStatus('❌ Mint failed: ' + (err.message || err));
  }
}

// ===== NFT FEED =====
function addNFTToFeed(tokenId, tokenURI) {
  const feed = document.getElementById('nftFeed');
  const div = document.createElement('div');
  div.innerHTML = `<strong>Token #${tokenId}</strong><br/><a href="${tokenURI}" target="_blank">View Metadata</a><hr/>`;
  feed.prepend(div);
}

window.connectWallet = connectWallet;
window.mintNFT = mintNFT;
window.showPreview = showPreview;

window.addEventListener('load', () => {
  setStatus('Connect your Base Wallet to start 🌈');
});
</script>
</head>
<body>
<h1>WantedNFT 🌈</h1>

<button onclick="connectWallet()">Connect Wallet 🌈</button><br/><br/>

<input type="text" id="nftName" placeholder="NFT Name" /><br/>
<input type="text" id="nftDesc" placeholder="NFT Description" /><br/>
<input type="file" id="nftImage" accept="image/*" onchange="showPreview(event)" /><br/>
<img id="previewImg" alt="Image Preview" /><br/>
<button id="mintButton" onclick="mintNFT()" disabled>Mint NFT 🌈</button>
<p id="status">Checking wallet...</p>

<h2>Live NFT Feed</h2>
<div id="nftFeed"></div>
</body>
</html>
